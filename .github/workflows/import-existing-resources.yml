name: Import existing Terraform resources

on:
  workflow_dispatch:

concurrency:
  group: terraform-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-2' }}
  TF_IN_AUTOMATION: true

jobs:
  import:
    name: Import existing IAM role
    runs-on: ubuntu-latest
    environment: copilot
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize Terraform
        run: terraform init -input=false
        env:
          TF_CLI_ARGS_init: -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="region=${{ env.AWS_REGION }}"

      - name: Import Lambda IAM role
        run: |
          if terraform state list | grep -qx 'aws_iam_role.lambda'; then
            echo "aws_iam_role.lambda is already in Terraform state."
          else
            terraform import -input=false \
              aws_iam_role.lambda \
              laura-ipsum-python-lambda-role
          fi
