name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: terraform-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-2' }}
  TF_IN_AUTOMATION: true

jobs:
  terraform:
    name: Terraform apply
    runs-on: ubuntu-latest
    environment: copilot
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize Terraform
        run: terraform init -input=false
        env:
          TF_CLI_ARGS_init: -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="region=${{ env.AWS_REGION }}"

      - name: Validate Terraform
        run: terraform validate

      - name: Create ECR repository
        run: terraform apply -input=false -auto-approve -target=aws_ecr_repository.event_service

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push event service image
        working-directory: app
        run: |
          REPO_URL=$(aws ecr describe-repositories --repository-names event-service --query 'repositories[0].repositoryUri' --output text)
          docker build -t "$REPO_URL:${{ github.sha }}" .
          docker push "$REPO_URL:${{ github.sha }}"

      - name: Create deployment plan
        env:
          TF_VAR_event_service_image_tag: ${{ github.sha }}
        run: terraform plan -input=false -out=tfplan

      - name: Apply deployment plan
        run: terraform apply -input=false -auto-approve tfplan

      - name: Print application URL
        run: |
          terraform output -raw event_service_url
